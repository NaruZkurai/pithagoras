# Portainer stack — pulls the prebuilt image, no build step.
# Set the environment variables in Portainer's stack UI.
services:
  pithagoras:
    image: ghcr.io/thecodacus/pithagoras:latest
    container_name: pithagoras
    restart: unless-stopped
    ports:
      - "${PORTAL_BIND:-0.0.0.0}:4100:4100"
    volumes:
      - pithagoras-data:/data
      # Workspaces the agent may work in.
      - ${WORKSPACES_DIR:-/root/repos}:/workspaces
      # Only needed when EXECUTOR=container.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PORTAL_PASSWORD: ${PORTAL_PASSWORD:?required}
      PORTAL_SECRET: ${PORTAL_SECRET:-}
      EXECUTOR: ${EXECUTOR:-host}
      PI_PROVIDER: ${PI_PROVIDER:-openrouter}
      PI_MODEL: ${PI_MODEL:-anthropic/claude-sonnet-5}
      PI_THINKING_LEVEL: ${PI_THINKING_LEVEL:-medium}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

volumes:
  pithagoras-data:
